name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    # ⚠️ Потолок нужен из-за job `ci_gate` в `deploy.yml` (`LEGACY-283`): оба запуска
    # заводит одно и то же событие, и гейт отсчитывает свои 30 минут. Зависший без потолка
    # прогон пережил бы дедлайн гейта, и тот отменил бы выкат с текстом «успешного прогона
    # не появилось» - то есть по таймеру, а не по красному CI. С потолком зависший прогон
    # завершается отказом, и гейт видит настоящий исход.
    #
    # ⚠️ Цифры разведены на десять минут не для красоты: `timeout-minutes` отсчитывается
    # от подбора раннера, а не от события, и два запуска подбираются не одновременно.
    # Закрыта разница очередей до десяти минут, а не случай вообще: задержись подбор
    # `quality` сильнее - зависший прогон снова переживёт дедлайн гейта.
    # Десять последних прогонов укладывались в 4-7 минут.
    timeout-minutes: 20

    # 🔴 База для бэкенда, поднимаемого ниже. До 26.08.2026 её здесь не было, потому что
    # e2e ходили на боевой API — и выбирали его рейт-лимит: пять спек подряд с одного
    # адреса, дальше `429` на каждый серверный рендер, страница ошибки вместо контента
    # и красный `main` при исправном коде (`LEGACY-288`). Своя база живёт один прогон,
    # лимита не имеет и никем, кроме этого job, не видна.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_pass
          POSTGRES_DB: books_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔴 Один и тот же `yarn ci` гоняют и эта проверка, и выкат. Раньше списки
      # шагов были разными: CI знал про `check-env`, `check-langs-sync` и порог
      # покрытия, выкат — нет. 10.08.2026 это разошлось до предела: CI краснел на
      # покрытии, а выкат тех же коммитов был зелёным и уезжал на прод
      # (`LEGACY-078`). Состав проверок теперь живёт в `package.json`, и
      # разъехаться двум конвейерам больше нечем.
      - name: Quality gates (same command the deploy runs)
        run: yarn ci

      # Бэкенд, против которого идут и сборка, и e2e. Образ — тот же, что стоит на проде:
      # `books/.github/workflows/deploy.yml` вешает `latest` только на релизный тег `v*`
      # без дефиса, поэтому `latest` тождественен боевому бэкенду и проверяется настоящая
      # связка фронта с настоящим бэкендом. Пакет анонимный — логин в ghcr не нужен,
      # секрет в этот конвейер не вносится.
      #
      # ⚠️ Энтрипойнт образа накатывает только миграции; сид он не зовёт. База наполняется
      # отдельным шагом ниже (`LEGACY-294`, с 02.09.2026), и там же проверяется, что данные
      # действительно доехали. До этого база оставалась пустой, и набор проверял структуру
      # страниц на пустом каталоге, а не разбор непустой выдачи.
      #
      # `--network host`: контейнер ходит в базу на `127.0.0.1:5432`, опубликованный
      # сервисом выше, и сам слушает `5000` прямо на раннере. Фронт в e2e занимает `3000`,
      # так что портам не тесно.
      #
      # Секреты генерируются на месте и живут один прогон. Записывать их literal'ом в файл
      # нечего: база пустая, пользователей в ней нет, а строка в репозитории читалась бы
      # как настоящий ключ. Плейсхолдеры вроде `secret` и `changeme` бэкенд отвергает сам
      # (`books/src/common/config/jwt-secrets.ts`).
      #
      # Схему накатывает энтрипойнт образа. Он же глушит свои отказы и продолжает старт
      # при недоступной базе — поэтому готовность проверяется снаружи, следующим шагом.
      - name: Start the backend the e2e run against
        id: start-backend
        run: |
          docker run -d --name books-api --network host \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgresql://e2e_user:e2e_pass@127.0.0.1:5432/books_e2e?schema=public' \
            -e JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
            -e JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
            -e CORS_ORIGIN='*' \
            ghcr.io/alex-berezov/books:latest
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/alex-berezov/books:latest

      # Апстрим проверяется до прогона, а не по симптому. Иначе недоступный API виден
      # как «локатор не найден» в спеке, и автор чинит фронт вместо того, чтобы
      # дождаться бэкенда.
      #
      # 🔴 Смотреть надо ТЕЛО, а не код ответа: `/api/health/readiness` отдаёт `200`
      # всегда, а состояние кладёт внутрь — `{"status":"up"|"down"}`
      # (`books/src/modules/health/health.controller.ts`). Проба по коду ответа зелёная
      # у мёртвой базы, то есть не способна покраснеть.
      #
      # 🔴 Одного `readiness` мало: он проверяет соединение запросом `SELECT 1`, а тот
      # проходит и на пустой схеме. Энтрипойнт образа при этом глушит отказ
      # `prisma migrate deploy` и стартует всё равно — то есть бэкенд без единой таблицы
      # отрапортует `"status":"up"`, а отказ вылезет позже, на пререндере в `yarn build`,
      # ошибкой Prisma внутри 500 от API. Поэтому следом дёргается настоящая списочная
      # ручка: `200` означает, что таблица существует и читается, `500` — что миграции
      # не накатились, и сказано это будет здесь, а не через два шага.
      #
      # Не поднялся бэкенд — прогон красный: шаг падает, логи печатает шаг `Backend log`.
      - name: Wait until the backend is ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/api/health/readiness -o "$RUNNER_TEMP/readiness.json"; then
              if grep -q '"status":"up"' "$RUNNER_TEMP/readiness.json"; then
                echo "backend reports ready after ${attempt} attempt(s):"
                cat "$RUNNER_TEMP/readiness.json"
                echo
                if curl -fsS http://127.0.0.1:5000/api/en/authors -o "$RUNNER_TEMP/schema-probe.json"; then
                  echo "schema is present: /api/en/authors answered 200"
                  exit 0
                fi
                echo "backend is up but /api/en/authors did not answer 200 — migrations are not applied"
                exit 1
              fi
            fi
            sleep 2
          done
          echo "backend did not report status=up within 120s"
          exit 1

      # База по устройству пустая: миграции накатывает энтрипойнт образа, а сид он
      # не зовёт вовсе. До 02.09.2026 её так и оставляли, и набор e2e зеленел, ничего
      # не проверив: спека хаба авторов выходила ранней веткой «ссылок на буквы нет,
      # проверять нечего», а перебор страниц шёл по пустому списку (`LEGACY-294`).
      #
      # 🔴 Глушить код возврата этого шага нельзя ничем: молча пропущенный сид
      # возвращает ровно то состояние, ради выхода из которого шаг и заведён,
      # а прогон при этом остаётся зелёным - то есть дефект прячется, а не чинится.
      # Подсказка ниже печатается на отказе и код возврата не подменяет: `exit 1`
      # стоит последним.
      #
      # ⚠️ Самый вероятный отказ здесь - устаревший образ, и выглядит он не как
      # «данных нет», а как ошибка ts-node внутри контейнера: сид зовётся командой
      # `ts-node ./prisma/seed.ts`, которой в образах старше 02.09.2026 не хватает
      # ни файла проекта, ни каталога локальных бинарей в `PATH`. Поэтому объяснение
      # стоит здесь, а не только в пробе на данные ниже: до пробы прогон не дойдёт.
      - name: Seed the backend database
        run: |
          if ! docker exec books-api node_modules/.bin/prisma db seed; then
            echo "::error::Сид не отработал внутри контейнера бэкенда."
            echo "Проверь, что ghcr.io/alex-berezov/books:latest собран после релиза,"
            echo "добавившего в образ tsconfig.json и /app/node_modules/.bin в PATH (LEGACY-294)."
            docker logs books-api | tail -n 50
            exit 1
          fi

      # Проба на то, что данные ДОЕХАЛИ, а не на то, что команда сида вернула ноль.
      # Образ берётся тегом `latest`, то есть боевым: пока релиз бэкенда с новым сидом
      # не доехал, `db seed` отработает старой версией и авторов не создаст, вернув при
      # этом ноль. Без этой пробы отказ вылез бы внутри спеки playwright - «ссылок
      # на букву нет» - и читался бы как поломка фронта, а не как устаревший образ.
      #
      # Группа `#` из счёта исключена намеренно: латинское имя в русском алфавите своей
      # буквы не имеет и уходит именно туда, а указатель рисует ссылку и на `#`. Считать
      # её значило бы зеленеть на данных, при которых перехода по букве на живой странице
      # всё равно нет.
      #
      # 🔴 Здесь читается ЧУЖОЙ контракт, и парным правилом он не покрыт (решение арбитра
      # от 02.09.2026, `books-app-docs/ai-context/decisions-log.md`). Источники формы:
      # `books/src/modules/public/public.controller.ts:370` (маршрут `authors/letters`)
      # и `books/src/modules/author/author.service.ts:429-464` (поля `letter` и `count`;
      # это проекция сырого SQL, DTO у неё нет, поэтому `XR01`/`XR03` не сработают).
      # Правило `XR08` сюда намеренно не расширено: `public.controller.ts` и `author.service.ts`
      # правятся десятками коммитов в квартал, и пара шумела бы на каждой рядовой правке.
      # Расплата за это - вот этот комментарий: правишь маршрут или имена полей в `books`,
      # правь и шаг ниже.
      - name: The seeded data actually arrived
        run: |
          # Отказ самого запроса разводится с пустым указателем: это разные причины,
          # и самая вероятная из них - переименование маршрута в чужом репозитории.
          # Голый `curl` сказал бы только `curl: (22) ... error: 404`.
          if ! curl -fsS http://127.0.0.1:5000/api/ru/authors/letters -o "$RUNNER_TEMP/letters.json"; then
            echo "::error::Ручка /api/ru/authors/letters не ответила 200."
            echo "Проверь маршрут authors/letters в books/src/modules/public/public.controller.ts - парным правилом эта граница не покрыта (LEGACY-292)."
            exit 1
          fi
          if ! filled=$(jq -e '[.[] | select(.count > 0 and .letter != "#")] | length' "$RUNNER_TEMP/letters.json"); then
            echo "::error::Ответ /api/ru/authors/letters не разбирается: ожидался массив записей с полями letter и count."
            echo "Похоже, форма ответа изменилась в books/src/modules/author/author.service.ts."
            cat "$RUNNER_TEMP/letters.json"
            exit 1
          fi
          if [ "$filled" -eq 0 ]; then
            echo "::error::Буквенный указатель /api/ru/authors/letters пуст: сид не создал ни одного автора с книгой."
            echo "Похоже, образ ghcr.io/alex-berezov/books:latest старше релиза, добавившего авторов в prisma/seed.ts (LEGACY-294)."
            cat "$RUNNER_TEMP/letters.json"
            exit 1
          fi
          echo "указатель наполнен: буквенных ссылок $filled"

          # 🔴 Вторая половина пробы - таксономия, и она такая же обязательная, как первая.
          # Шаг SEO ниже требует живой ссылки на каждом из четырёх хабов, а хаб рисует
          # только линкуемый термин: видимый, индексируемый, с переводом на язык страницы,
          # непустым счётчиком книг и `autoIndexable`. Пока образ старше релиза, добавившего
          # каталог в `books/prisma/seed.ts` (`Q1`, `LEGACY-016`), аудит покраснеет строкой
          # «на хабе нет ссылок», и причину пришлось бы искать во фронте вместо чужого сида.
          #
          # 🔴 Здесь читается ЧУЖОЙ контракт, и парным правилом он не покрыт — ровно как
          # у пробы авторов выше. Источники формы: `books/src/modules/category/category.controller.ts`
          # (маршрут `categories/tree`), `books/src/modules/category/category.service.ts:989-1005`
          # и `books/src/modules/tags/tags.service.ts` (поля `booksCount`, `autoIndexable`,
          # `isVisible`, `indexable`, `translations[].language`). Правило `XR08` сюда не
          # расширено по той же причине, что и для авторов: эти файлы правятся десятками
          # коммитов в квартал. Расплата — вот этот комментарий: правишь маршрут или имена
          # полей в `books`, правь и шаг ниже.
          #
          # ⚠️ Перебираются все четыре вида и все пять языков, а не одна пара. Смоук берёт
          # `en/categories`, `ru/genres`, `es/collections`, `fr/tags`, `pt/categories`
          # (`scripts/seo-audit.mjs:553,573`), и проба на одной паре зеленела бы при просевшем
          # `pt`-переводе - то есть ровно в том случае, ради которого она и написана.
          #
          # Условие повторяет `lib/seo/taxonomy-linkable.ts:55-74` целиком, включая
          # `isVisible` и `indexable` (оба правятся из админки, и скрытый там термин прошёл бы
          # пробу с непустым счётчиком, а хаб ссылку не нарисовал бы) и трактовку пропущенного
          # `autoIndexable`: фронт читает его как `?? true`, поэтому здесь `!= false`, а не
          # `== true`. Со строгим равенством проба краснела бы текстом «образ старше релиза»
          # ровно тогда, когда бэкенд перестал проецировать поле, а хабы работают.
          linkable_filter() {
            jq -e --arg lang "$1" '[.. | objects
              | select(.isVisible != false and .indexable != false and .booksCount > 0
                       and .autoIndexable != false
                       and ([.translations[]? | select(.language == $lang)] | length > 0))
              ] | length' "$2"
          }

          for lang in en ru es fr pt; do
            for type in category genre collection; do
              if ! curl -fsS "http://127.0.0.1:5000/api/categories/tree?lang=$lang&type=$type" -o "$RUNNER_TEMP/terms.json"; then
                echo "::error::Ручка /api/categories/tree не ответила 200 ($lang/$type)."
                echo "Проверь маршрут categories/tree в books/src/modules/category/category.controller.ts."
                exit 1
              fi
              if ! linkable=$(linkable_filter "$lang" "$RUNNER_TEMP/terms.json"); then
                echo "::error::Ответ /api/categories/tree не разбирается: ожидались узлы с booksCount, autoIndexable и translations."
                echo "Похоже, форма ответа изменилась в books/src/modules/category/category.service.ts."
                cat "$RUNNER_TEMP/terms.json"
                exit 1
              fi
              if [ "$linkable" -eq 0 ]; then
                echo "::error::Хаб $type на /$lang пуст: ни один термин не линкуем."
                echo "Похоже, образ ghcr.io/alex-berezov/books:latest старше релиза, добавившего каталог таксономии в prisma/seed.ts (LEGACY-016, пачка Q1)."
                cat "$RUNNER_TEMP/terms.json"
                exit 1
              fi
            done

            # Теги живут своей ручкой: у них нет дерева, и список языковой.
            if ! curl -fsS "http://127.0.0.1:5000/api/$lang/tags?limit=100" -o "$RUNNER_TEMP/tags.json"; then
              echo "::error::Ручка /api/$lang/tags не ответила 200."
              echo "Проверь маршрут tags в books/src/modules/public/public.controller.ts."
              exit 1
            fi
            if ! linkable=$(linkable_filter "$lang" "$RUNNER_TEMP/tags.json"); then
              echo "::error::Ответ /api/$lang/tags не разбирается: ожидались записи с booksCount, autoIndexable и translations."
              echo "Похоже, форма ответа изменилась в books/src/modules/tags/tags.service.ts."
              cat "$RUNNER_TEMP/tags.json"
              exit 1
            fi
            if [ "$linkable" -eq 0 ]; then
              echo "::error::Хаб тегов на /$lang пуст: ни один тег не линкуем."
              echo "Похоже, образ ghcr.io/alex-berezov/books:latest старше релиза, добавившего каталог таксономии в prisma/seed.ts (LEGACY-016, пачка Q1)."
              cat "$RUNNER_TEMP/tags.json"
              exit 1
            fi
          done
          echo "таксономия наполнена: четыре вида хабов на пяти языках"

      # Сборка здесь потому, что lint, typecheck и тесты её не заменяют.
      # 08.08.2026 импорт `next/headers` в файл, общий для сервера и клиента,
      # прошёл все три проверки зелёными и упал только в деплое: запрет на такой
      # импорт действует на этапе сборки, а сборка выполнялась лишь при выкате.
      #
      # 🔴 Адрес API задаётся ИМЕННО ЗДЕСЬ и нигде больше. `NEXT_PUBLIC_*` подставляются
      # литералами на `next build` — и в клиентский бандл, и в серверный, — поэтому
      # `next start` окружением их уже не переопределяет. Раньше те же четыре строки
      # дублировались на шаге e2e и не значили там ничего (`LEGACY-291`).
      #
      # ⚠️ Отсюда следует, что собранное здесь приложение одноразовое и для выката
      # непригодно: его клиентский бандл стучится в `127.0.0.1:5000`. Выкат собирает
      # свой образ сам, из `vars.*` (`deploy.yml`); переиспользовать эту сборку нельзя.
      #
      # Локальны два адреса: API и сам сайт; язык и CDN остаются прод-значениями.
      #
      # 🔴 `NEXT_PUBLIC_SITE_URL` стал локальным 08.09.2026 (`Q1`, `LEGACY-016`, решение
      # арбитра в `books-app-docs/ai-context/decisions-log.md`) и это не косметика.
      # Карта сайта строит **абсолютные** адреса из этого значения на этапе сборки
      # (`lib/sitemap/utils.ts:13-15`). С прод-значением локальный инстанс отдавал бы карту
      # с адресами `https://bibliaris.com/...`, и SEO-аудит ниже, запущенный против
      # `127.0.0.1:3000`, пошёл бы краулить **боевой сайт** с раннера на каждом PR —
      # проверяя не тот код, который в этом PR лежит.
      #
      # ⚠️ У сторожа `scripts/check-site-url.mjs` беззубой стала ровно одна проверка из пяти —
      # сверка хостов сайта и API. Она сравнивает `URL.host`, то есть хост **с портом**
      # (`check-site-url.mjs:107-120`): `127.0.0.1:3000` и `127.0.0.1:5000` различны, шаг
      # проходит. Остальные четыре живы и краснеют здесь по-настоящему: незаданный
      # `NEXT_PUBLIC_SITE_URL`, неабсолютный адрес, не-http-схема и служебный хост
      # (`api.`, `media.`, `cdn.`…) в самом адресе сайта.
      - name: Build (catches server/client boundary errors)
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:5000/api
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_DEFAULT_LANG: en
          NEXT_PUBLIC_MEDIA_CDN_URL: https://media.bibliaris.com

      # 🔴 Набор e2e существовал в репозитории с февраля и не запускался нигде
      # (`LEGACY-154`): ни `ci.yml`, ни `deploy.yml` его не звали, поэтому
      # единственная проверка гейта админки и единственное покрытие хаба авторов
      # были зелёными по факту неисполнения, а второй спек больше полугода стоял
      # заведомо красным и никто этого не видел.
      #
      # Прогон идёт против `yarn start`, то есть против собранного выше приложения —
      # того самого, что поедет на прод, — а не против dev-сервера. Только chromium:
      # три браузера втрое дороже, а ловят они одно и то же.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Блока `env:` здесь нет намеренно: адрес API уже впечён сборкой выше, и строки,
      # выглядящие как настройка прогона, ею не являются.
      # ⚠️ Оговорка: «после сборки не задаёт ничего» верно про адрес API, но не про всё
      # семейство. `next.config.js` перечитывается при `next start` и берёт из окружения
      # `NEXT_PUBLIC_MEDIA_CDN_URL` для `images.remotePatterns` — такая переменная здесь
      # работала бы. Сегодня она не нужна: тот же хост стоит в конфиге статической записью.
      - name: E2E (chromium, against the app built above)
        run: yarn e2e --project=chromium

      # 🔴 SEO-аудит на пути PR (`Q1`, `LEGACY-016`). До 08.09.2026 `scripts/seo-audit.mjs`
      # гонялся только после деплоя и по ночному расписанию против живого домена: контракт
      # «ссылка = карта сайта = robots» на пути PR не проверял никто, и регрессия уезжала
      # на прод, чтобы быть найденной уже там.
      #
      # Сервер поднимается своим `yarn start`, а не переиспользуется от e2e: тот запускает
      # и **гасит** его сам (`playwright.config.ts:71-77`, `reuseExistingServer` на CI ложно),
      # и поднять свой раньше нельзя — playwright упрётся в занятый порт.
      #
      # `APP_COMMIT_SHA` обязателен: `app/api/version/route.ts` читает его в рантайме, а без
      # непустого `sha` аудит отказывается судить и выходит кодом 2 (`seo-audit.mjs:446-473`).
      # Он же и есть смысл переменной — отчёт обязан называть сборку, которую судил.
      #
      # `--mode=smoke`, а не `full`: полный обход всей карты идёт с шагом 1400 мс на запрос
      # (`seo-audit.mjs:55-72`, темп задан рейт-лимитом бэкенда) и занял бы десятки минут
      # при потолке job'а в 20. Полный контракт проверяет ночной прогон `seo-audit.yml`,
      # который эта правка не трогает.
      - name: SEO audit (against the app built above)
        run: |
          # 🔴 `npx next start`, а не `yarn start`: `$!` обёртки — pid самого yarn, и SIGTERM
          # в него не обязан дойти до дочернего `next`. Порт остался бы занятым до конца job'а,
          # а «проверка живости» проверяла бы живость обёртки.
          npx next start > "$RUNNER_TEMP/next-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/next.pid"

          # Готовность ждём по коду ответа: `next start` печатает "Ready" раньше, чем
          # начинает отвечать на первый запрос standalone-сборкой.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/version; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3000/api/version -o "$RUNNER_TEMP/version.json"; then
            echo "::error::Фронт не поднялся за 120 секунд."
            cat "$RUNNER_TEMP/next-start.log"
            exit 1
          fi

          # `--api` не передаётся намеренно: `API_BASE` читает только
          # `collectTaxonomyTerms`, а её зовёт один `runFullContract`
          # (`scripts/seo-audit.mjs:261-265`, `:479`, `:707-709`). В `smoke` аргумент
          # был бы строкой, выглядящей настройкой прогона и ею не являющейся
          # (`LEGACY-291`). Правило 7.7 на пути PR поэтому не проверяется — его
          # держит ночной `seo-audit.yml`.
          node scripts/seo-audit.mjs \
            --base=http://127.0.0.1:3000 \
            --mode=smoke
        env:
          APP_COMMIT_SHA: ${{ github.sha }}

      # 🔴 Отдельной строкой, а не внутри аудита: кластер `hreflang` строится **не** из того
      # счётчика, который читают хабы. Хабы берут живой счёт сырым SQL, а карта сайта —
      # кэш `CategoryTranslation.bookCount` (`lib/seo/hreflang-alternates.ts:83-104`
      # через `app/sitemaps/[filename]/route.ts:313`). Нулевой кэш в засеянной базе оставляет
      # все адреса терминов вовсе без `xhtml:link`, включая self-ссылку, — при зелёном аудите
      # и зелёных хабах. Решение арбитра 08.09.2026, `books-app-docs/ai-context/decisions-log.md`.
      - name: Sitemap terms carry their hreflang cluster
        # Шаг заведён отдельно от аудита ради независимости — значит и краснеть обязан
        # независимо: без этого условия первая же находка аудита прячет вердикт по кластеру.
        if: success() || failure()
        run: |
          # Кэш `bookCount` сид заполняет двумя разными кусками — переводами категорий
          # и переводами тегов, — поэтому файлы проверяются обоих родов. Языка два:
          # кластер собирается из всех переводов термина, и просевший язык виден с любой
          # стороны, а перебор всех пяти стоил бы двадцати запросов ради того же ответа.
          for file in sitemap-categories-en sitemap-genres-ru sitemap-collections-es sitemap-tags-fr; do
            if ! curl -fsS "http://127.0.0.1:3000/sitemaps/$file.xml" -o "$RUNNER_TEMP/$file.xml"; then
              echo "::error::Файл карты сайта /sitemaps/$file.xml не ответил 200."
              exit 1
            fi
            if ! grep -q '<url>' "$RUNNER_TEMP/$file.xml"; then
              echo "::error::Карта $file пуста: ни одного <url>."
              echo "Сид не дал ни одного линкуемого термина этого вида — та же причина, что и в пробе данных выше."
              cat "$RUNNER_TEMP/$file.xml"
              exit 1
            fi
            if ! grep -q 'xhtml:link' "$RUNNER_TEMP/$file.xml"; then
              echo "::error::В карте $file нет ни одной ссылки xhtml:link: кластер hreflang пуст."
              echo "Самая вероятная причина - bookCount перевода остался нулём в базе:"
              echo "хабы читают живой счёт и зеленеют, а кластер строится из кэша (LEGACY-016, пачка Q1)."
              cat "$RUNNER_TEMP/$file.xml"
              exit 1
            fi
          done
          echo "кластер hreflang на месте во всех четырёх видах карты"

      # Условие не голое `always()`: сервер поднимается шагом выше, и при падении до него
      # (сборка, e2e) файла с pid не существует вовсе.
      - name: Stop the front-end server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/next.pid" ]; then
            pid=$(cat "$RUNNER_TEMP/next.pid")
            # Явная проверка живости, а не глушение кода возврата: уже завершившийся
            # сервер - штатный случай уборки, а не отказ, и различать их обязан шаг.
            if kill -0 "$pid" 2>/dev/null; then kill "$pid"; fi
          fi

      - name: Front-end log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/next-start.log" ]; then tail -n 100 "$RUNNER_TEMP/next-start.log"; fi

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Условие не голое `failure()`: самый частый красный - `yarn ci` до старта
      # контейнера. Тогда голый шаг печатал бы `No such container` и падал сам,
      # добавляя в отчёт красную строку про бэкенд, которого не было.
      - name: Backend log
        if: failure() && steps.start-backend.outcome == 'success'
        run: docker logs books-api
