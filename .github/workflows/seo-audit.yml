name: 🔎 SEO contract audit

# The unit tests guard the code; this guards the state. У0 survived for months
# with correct code because only the data moved — nothing was committed on the
# day the sitemap started advertising 2205 empty pages. So the audit is tied to
# time as well as to deployment:
#   - after every deploy, while the cause is obvious and the rollback is cheap;
#   - daily, because data drifts without anyone pushing.
on:
  workflow_run:
    workflows: ['Deploy Frontend']
    types: [completed]
  schedule:
    # An hour after the backend recomputes taxonomy indexability (03:00 UTC).
    # Not on the hour: GitHub's scheduler queues everything set to :00 together
    # and delays it — the 06.08 run was asked for at 04:00 and started at 05:00.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to audit'
        required: false
        default: 'https://bibliaris.com'

jobs:
  audit:
    name: Crawl sitemap and internal links
    runs-on: ubuntu-latest
    # A failed deploy has nothing to audit.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The site runs as a single container, so a deploy is a restart and requests
      # during the swap are simply not served. Three of the four post-deploy runs
      # measured that gap and reported it as the site being broken (21%, 37%, 13%
      # of fetches failing); the scheduled run over the same site at an idle hour
      # had zero failures. So the audit waits for the site to be back before it
      # starts crawling — otherwise it keeps measuring the deploy, not the site.
      #
      # Three *consecutive* successes are necessary but not sufficient: the
      # outgoing container answers 200 right up to the moment it is replaced. The
      # 06.08 post-deploy run proved it — readiness passed on attempts 1-3, then
      # the crawl walked into the swap and reported 164 violations, every one of
      # which answered 200 again minutes later. So on a deploy-triggered run the
      # check also requires the container to *be* the new build, by SHA.
      - name: Wait for the new build to be serving
        env:
          BASE: ${{ github.event.inputs.base_url || 'https://bibliaris.com' }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ]; then
            echo "Waiting for build $EXPECTED_SHA"
          else
            echo "No deploy to wait for (scheduled or manual run) — checking liveness only"
          fi

          streak=0
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/en" || echo 000)
            ok=0
            if [ "$code" = "200" ]; then
              if [ -z "$EXPECTED_SHA" ]; then
                ok=1
                detail="200"
              else
                served=$(curl -s --max-time 15 "$BASE/api/version" | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')
                if [ "$served" = "$EXPECTED_SHA" ]; then
                  ok=1
                  detail="200, build ${served:0:7}"
                else
                  detail="200 but build ${served:-unknown} != ${EXPECTED_SHA:0:7} — still the old container"
                fi
              fi
            else
              detail="$code"
            fi

            if [ "$ok" = "1" ]; then
              streak=$((streak + 1))
              echo "attempt $attempt: $detail (streak $streak/3)"
              [ "$streak" -ge 3 ] && exit 0
            else
              [ "$streak" -gt 0 ] && echo "attempt $attempt: $detail — streak reset"
              streak=0
            fi
            sleep 5
          done
          echo "::error::Within 5 minutes the site never answered 200 three times in a row from the expected build. Not crawling — this run would have measured a deploy, not the contract."
          exit 2

      # Exit 1 = the contract is broken. Exit 2 = the audit could not get clean
      # answers and says nothing about the site; that is not a contract failure
      # and must not be reported as one.
      - name: Run audit
        run: node scripts/seo-audit.mjs --base=${{ github.event.inputs.base_url || 'https://bibliaris.com' }}
