name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bibliaris-frontend

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      # ⚠️ Тот же `yarn ci`, что и в проверке CI, — и это не дубль ради
      # надёжности, а единственный способ не дать конвейерам разойтись. Здесь
      # раньше стояли `lint`, `typecheck` и `test --run` **без** порога покрытия
      # и без гвардов окружения, поэтому выкат пропускал то, на чём CI краснел
      # (`LEGACY-078`).
      - run: yarn ci

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_owner: ${{ steps.repo.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_DEFAULT_LANG=${{ vars.NEXT_PUBLIC_DEFAULT_LANG }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_MEDIA_CDN_URL=${{ vars.NEXT_PUBLIC_MEDIA_CDN_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file and deploy script to server
        run: |
          scp docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bibliaris-frontend/app/src/docker-compose.prod.yml
          scp scripts/deploy-bluegreen.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/bibliaris-frontend/app/src/deploy-bluegreen.sh

      # Выкат идёт скриптом, а не `compose up`, потому что нужен порядок:
      # поднять рядом → дождаться ответа → переключить Caddy → погасить старое.
      # `compose up` останавливал единственный контейнер раньше, чем новый
      # начинал отвечать, и всё это время сайт не обслуживал никто.
      - name: Deploy via SSH (blue-green)
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_OWNER: ${{ needs.build.outputs.image_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -euo pipefail
            cd /opt/bibliaris-frontend/app/src
            echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
            export IMAGE_TAG=${IMAGE_TAG}
            export GHCR_OWNER=${GHCR_OWNER}
            chmod +x deploy-bluegreen.sh
            ./deploy-bluegreen.sh
          "

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://bibliaris.com/ -o /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 60s"
          exit 1
